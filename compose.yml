services:
  lobby:
    container_name: rooms-lobby
    build:
      context: .
      dockerfile: lobby/Dockerfile
      args:
        USER: lobbyuser
    ports:
      - "2200:22"
    networks:
        nt-rooms-lobby:
            ipv4_address: 10.100.0.2
        nt-rooms-lvl-01:
            ipv4_address: 10.100.0.5



################################################
networks:
  nt-rooms-lobby:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.0.0/29
          gateway: 10.100.0.1

  nt-rooms-lvl-01:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.1.0/29
          gateway: 10.100.1.1

  nt-rooms-lvl-02:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.2.0/24
          gateway: 10.100.2.1

  nt-rooms-lvl-03:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.3.0/24
          gateway: 10.100.3.1

  nt-rooms-lvl-04:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.4.0/24
          gateway: 10.100.4.1