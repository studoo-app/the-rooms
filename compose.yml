            ipv4_address: 10.100.7.3

  level-07-dbserver:
    container_name:  nt-rooms-lvl07-dbserver
    image: mariadb:11
#    ports:
#      - "3306:3306"
    restart: always
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_ROOT_PASSWORD: studoo
      #MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      #MYSQL_USER: app_db_user
      #MYSQL_PASSWORD: app_db_password
    volumes:
      - ./levels/level-07-dbserver/var/dbdata:/var/lib/mysql
      - ./levels/level-07-dbserver/docs/init.sql:/docker-entrypoint-initdb.d/init.sql

