networks:
  nt-rooms-lobby:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.0.0/29
          gateway: 10.100.0.1

  nt-rooms-lvl-01:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.1.0/29
          gateway: 10.100.1.1

  nt-rooms-lvl-02:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.2.0/29
