services:
  lobby:
    container_name: rooms-lobby
    build:
      context: .
      dockerfile: lobby/Dockerfile
      args:
        USER: newbie
        PASS: password
    ports:
      - "2200:22"
    networks:
        nt-rooms-lobby:
            ipv4_address: 10.100.0.2
        nt-rooms-lvl-01:
            ipv4_address: 10.100.1.5

  level-01:
    container_name: nt-rooms-lvl01
