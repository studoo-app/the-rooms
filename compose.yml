services:
  lobby:
    container_name: rooms-lobby
    build:
      context: .
      dockerfile: lobby/Dockerfile
      args:
        USER: newbie
        PASS: password
    ports:
      - "2200:22"
    networks:
        nt-rooms-lobby:
            ipv4_address: 10.100.0.2
        nt-rooms-lvl-01:
            ipv4_address: 10.100.1.5

  level-01:
    container_name: nt-rooms-lvl01
    build:
      context: .
      dockerfile: levels/level-01/Dockerfile
      args:
        USER: lvl01
        PASS: lvl01password # TODO: change password in compose for level 1
    networks:
        nt-rooms-lvl-01:
            ipv4_address: 10.100.1.2
        nt-rooms-lvl-02:
          ipv4_address: 10.100.2.5

  level-02:
    container_name: nt-rooms-lvl02
    build:
      context: .
      dockerfile: levels/level-02/Dockerfile
      args:
        USER: lvl02
        PASS: lvl02password # TODO: change password in compose for level 2
    networks:
      nt-rooms-lvl-02:
        ipv4_address: 10.100.2.2
      nt-rooms-lvl-03:
        ipv4_address: 10.100.3.5

  level-03:
    container_name: nt-rooms-lvl03
    build:
      context: .
      dockerfile: levels/level-03/Dockerfile
      args:
        USER: lvl03
        PASS: lvl03password # TODO: change password in compose for level 3
    networks:
      nt-rooms-lvl-03:
        ipv4_address: 10.100.3.2
      nt-rooms-lvl-04:
        ipv4_address: 10.100.4.5

################################################
networks:
  nt-rooms-lobby:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.0.0/29
          gateway: 10.100.0.1

  nt-rooms-lvl-01:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.1.0/29
          gateway: 10.100.1.1

  nt-rooms-lvl-02:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.2.0/29
          gateway: 10.100.2.1

  nt-rooms-lvl-03:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.3.0/29
          gateway: 10.100.3.1

  nt-rooms-lvl-04:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.4.0/24
          gateway: 10.100.4.1